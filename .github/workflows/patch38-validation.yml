name: Patch 38 validation

on:
  push:
    branches:
      - patch38-public-routing-auth-seo
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patch38-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full regression suite
        run: npm test
      - name: Syntax verification
        run: node scripts/check-all-syntax.js
      - name: Build Cloudflare assets
        run: npm run build:cloudflare
      - name: Validate Patch 38 dist contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<div id="app-root"></div>' dist/app.html
          grep -q 'id="login-form"' dist/login.html
          grep -q '/css/auth-patch38.css' dist/login.html
          grep -q '/js/auth-route-patch38.js' dist/login.html
          grep -q 'noindex,nofollow' dist/login.html
          grep -q 'Obras, financeiro e engenharia.' dist/index.html
          grep -q 'href="/" aria-label="FinObra"' dist/index.html
          grep -q 'property="og:title"' dist/index.html
          grep -q 'Política de Privacidade' dist/privacidade.html
          grep -q 'Termos de Serviço' dist/termos.html
          grep -q 'Portal de Validação de Registros de Assinatura' dist/validar.html
          test -f dist/data/robots.txt
          test -f dist/data/sitemap.xml
      - name: Validate Wrangler bundle
        run: npx --yes wrangler deploy --dry-run
