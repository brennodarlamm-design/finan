name: Apply FinObra Patch 22

on:
  push:
    branches:
      - patch22-deploy-20260912
    paths:
      - '.github/workflows/apply-patch22.yml'
      - '.patch22/**'
      - 'js/patch22.js'
      - 'migrations/015_engineering_config_persistence.sql'
      - 'scripts/test-patch22-static.js'

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Patch 22 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Patch 22 diffs
        shell: bash
        run: |
          set -euo pipefail
          for patch in .patch22/01_auth_admin.diff .patch22/02_db_backend.diff .patch22/03_frontend_schema.diff .patch22/04_migrations_tests.diff; do
            echo "Checking $patch"
            git apply --check "$patch"
            git apply "$patch"
          done

      - name: Align package, test suite and version metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '2.22.0';
          pkg.scripts = pkg.scripts || {};
          pkg.scripts['test:patch22'] = 'node scripts/test-patch22-static.js';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          const testsPath = 'scripts/test-static-all.js';
          let tests = fs.readFileSync(testsPath, 'utf8');
          if (!tests.includes("'scripts/test-patch22-static.js'")) {
            tests = tests.replace(
              "  'scripts/test-patch21-static.js'\n].filter(fs.existsSync);",
              "  'scripts/test-patch21-static.js',\n  'scripts/test-patch22-static.js'\n].filter(fs.existsSync);"
            );
          }
          if (!tests.includes("'scripts/test-patch22-static.js'")) {
            throw new Error('Não foi possível registrar Patch 22 em scripts/test-static-all.js');
          }
          fs.writeFileSync(testsPath, tests);

          fs.writeFileSync('version.json', JSON.stringify({
            version: '2.22.0',
            build: '2026.09.12-p22',
            released_at: new Date().toISOString()
          }) + '\n');
          NODE

      - name: Patch 22 validation
        run: node scripts/test-patch22-static.js

      - name: JavaScript syntax validation
        run: node scripts/check-all-syntax.js

      - name: Full static suite
        run: npm test

      - name: Commit validated Patch 22
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FinObra Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Patch 22 changes to commit."
            exit 0
          fi
          git commit -m "fix: Patch 22 persistence, auth recovery, migrations and WhatsApp hardening [patch22-applied]"
          git push origin HEAD:patch22-deploy-20260912
