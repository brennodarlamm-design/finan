name: Patch 35 FinBot OCR UX update (no deploy)

on:
  push:
    branches:
      - patch35-large-audit
    paths:
      - .github/workflows/patch35-finbot-ocr-ux.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch35-large-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply requested changes
        run: python3 scripts/patch35-requested-update.py
      - name: Validate requested changes
        run: |
          node scripts/test-finbot-learning-static.js
          npm test
          node scripts/check-all-syntax.js
          npm audit --omit=dev --audit-level=moderate
          cd backend
          npm ci
          npm audit --omit=dev --audit-level=moderate
      - name: Verify requested boundaries
        run: |
          if grep -Eq "OPENAI_API_KEY|api.openai.com|gpt-4o-mini" api/reconhecer-documento.js; then exit 1; fi
          if grep -Eq "OPENAI_API_KEY|api.openai.com|getOpenAIBotReply" api/users.js; then exit 1; fi
          if grep -Eq "cfg-tab-diagnostico|_renderDiagnostico|action=errors" js/configuracoes.js; then exit 1; fi
          grep -q "gemini-3.6-flash" api/reconhecer-documento.js
          grep -q "findLearnedSupportAnswer" api/users.js
          grep -q "carregarErrosSaaS" js/master.js
      - name: Commit requested changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -- dist || true
          git add api/reconhecer-documento.js api/users.js js/configuracoes.js js/ocr.js package.json scripts/test-patch08-static.js scripts/test-patch35-static.js scripts/test-finbot-learning-static.js scripts/test-static-all.js
          git add -u scripts/test-openai-static.js
          git diff --cached --check
          git commit -m "feat(patch35): move diagnostics to DEV and add learned FinBot"
          git push origin HEAD:patch35-large-audit
