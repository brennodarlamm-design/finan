name: FinObra production CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finobra-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full regression suite
        run: npm test
      - name: Syntax verification
        run: node scripts/check-all-syntax.js
      - name: Build Cloudflare static assets
        run: npm run build:cloudflare
      - name: Validate Wrangler bundle
        run: npx --yes wrangler deploy --dry-run

  deploy-cloudflare:
    needs: validate
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Cloudflare deploy credentials
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials detected; production deploy enabled."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deploy skipped. Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets to enable automatic production deployment."
          fi
      - name: Build production assets
        if: steps.cloudflare.outputs.ready == 'true'
        run: npm run build:cloudflare
      - name: Deploy Worker and static assets
        if: steps.cloudflare.outputs.ready == 'true'
        run: npm run deploy:cloudflare
      - name: Post-deploy smoke test
        if: steps.cloudflare.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail

          health=''
          for attempt in {1..12}; do
            health="$(curl --fail --silent --show-error https://finobra.app.br/__finobra/health || true)"
            if [[ "$health" == *'"ok":true'* && "$health" == *'"securityMode":"nonce-csp"'* && "$health" == *'"loopRisk":false'* ]]; then
              break
            fi
            echo "Waiting for Cloudflare propagation (${attempt}/12)..."
            sleep 5
          done

          [[ "$health" == *'"ok":true'* ]]
          [[ "$health" == *'"securityMode":"nonce-csp"'* ]]
          [[ "$health" == *'"loopRisk":false'* ]]

          final_url="$(curl --fail --silent --show-error --location --output /dev/null --write-out '%{url_effective}' https://www.finobra.app.br/)"
          [[ "$final_url" == 'https://finobra.app.br/' ]]

          auth_status="$(curl --silent --output /dev/null --write-out '%{http_code}' 'https://finobra.app.br/api/auth?action=me')"
          [[ "$auth_status" == '401' ]]

          echo "Production smoke test passed."
