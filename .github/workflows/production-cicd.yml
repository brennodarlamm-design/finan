name: FinObra CI / manual production deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Confirmar deploy em producao'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: finobra-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full regression suite
        run: npm test
      - name: Syntax verification
        run: node scripts/check-all-syntax.js
      - name: Build Cloudflare static assets
        run: npm run build:cloudflare
      - name: Validate Wrangler bundle
        run: npx --yes wrangler deploy --dry-run

  wait-vercel-api:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.deploy_production == true) ||
        (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[deploy-production]'))
      )
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel API release
        shell: bash
        run: |
          set -euo pipefail
          health=''
          for attempt in {1..40}; do
            health="$(curl --fail --silent --show-error 'https://api.finobra.app.br/api/auth?action=health' || true)"
            if [[ "$health" == *'"ok":true'* && \
                  "$health" == *'"releaseReady":true'* && \
                  "$health" == *'"source":"vercel"'* && \
                  "$health" == *'"environment":"production"'* && \
                  "$health" == *"\"commit\":\"$GITHUB_SHA\""* ]]; then
              echo "Vercel API ready on $GITHUB_SHA"
              exit 0
            fi
            echo "Waiting for Vercel API release $GITHUB_SHA ($attempt/40)..."
            sleep 15
          done
          echo "::error::Vercel API did not reach release $GITHUB_SHA; Cloudflare deploy is blocked."
          echo "Last health: $health"
          exit 1

  deploy-cloudflare:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.deploy_production == true) ||
        (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[deploy-production]'))
      )
    needs: [validate, wait-vercel-api]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Cloudflare deploy credentials
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials detected; manual production deploy enabled."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID before production deploy."
            exit 1
          fi
      - name: Build production assets
        run: npm run build:cloudflare
      - name: Deploy Worker and static assets
        run: npm run deploy:cloudflare
      - name: Post-deploy smoke test
        shell: bash
        run: |
          set -euo pipefail

          health=''
          for attempt in {1..12}; do
            health="$(curl --fail --silent --show-error https://finobra.app.br/__finobra/health || true)"
            if [[ "$health" == *'"ok":true'* && \
                  "$health" == *'"securityMode":"nonce-csp"'* && \
                  "$health" == *'"loopRisk":false'* && \
                  "$health" == *'"deploymentMetadataOk":true'* && \
                  "$health" == *"\"commit\":\"$GITHUB_SHA\""* ]]; then
              break
            fi
            echo "Waiting for Cloudflare propagation (${attempt}/12)..."
            sleep 5
          done

          [[ "$health" == *'"ok":true'* ]]
          [[ "$health" == *'"securityMode":"nonce-csp"'* ]]
          [[ "$health" == *'"loopRisk":false'* ]]
          [[ "$health" == *'"deploymentMetadataOk":true'* ]]
          [[ "$health" == *"\"commit\":\"$GITHUB_SHA\""* ]]

          version="$(curl --fail --silent --show-error https://finobra.app.br/version.json)"
          [[ "$version" == *"\"commit\":\"$GITHUB_SHA\""* ]]
          [[ "$version" == *'"source":"github-actions"'* ]]

          api_health="$(curl --fail --silent --show-error 'https://api.finobra.app.br/api/auth?action=health')"
          [[ "$api_health" == *'"ok":true'* ]]
          [[ "$api_health" == *'"releaseReady":true'* ]]
          [[ "$api_health" == *'"source":"vercel"'* ]]
          [[ "$api_health" == *'"environment":"production"'* ]]
          [[ "$api_health" == *"\"commit\":\"$GITHUB_SHA\""* ]]

          final_url="$(curl --fail --silent --show-error --location --output /dev/null --write-out '%{url_effective}' https://www.finobra.app.br/)"
          [[ "$final_url" == 'https://finobra.app.br/' ]]

          auth_status="$(curl --silent --output /dev/null --write-out '%{http_code}' 'https://finobra.app.br/api/auth?action=me')"
          [[ "$auth_status" == '401' ]]

          check_route() {
            local url="$1"
            local expected_route="$2"
            local expected_text="$3"
            local prefix="$4"
            local status

            status="$(curl --silent --show-error --dump-header "/tmp/${prefix}.headers" --output "/tmp/${prefix}.html" --write-out '%{http_code}' "$url")"
            [[ "$status" == '200' ]]
            tr -d '\r' < "/tmp/${prefix}.headers" | grep -qi "^x-finobra-route: ${expected_route}$"
            grep -Fq "$expected_text" "/tmp/${prefix}.html"
          }

          check_document() {
            local url="$1"
            local expected_text="$2"
            local prefix="$3"
            local status

            status="$(curl --silent --show-error --output "/tmp/${prefix}.html" --write-out '%{http_code}' "$url")"
            [[ "$status" == '200' ]]
            grep -Fq "$expected_text" "/tmp/${prefix}.html"
          }

          check_route 'https://finobra.app.br/' 'landing-shell' 'Obras, financeiro e engenharia.' 'finobra-home'
          grep -Fq '<link rel="canonical" href="https://finobra.app.br/">' /tmp/finobra-home.html

          check_route 'https://finobra.app.br/login' 'login-shell' 'id="login-form"' 'finobra-login'
          tr -d '\r' < /tmp/finobra-login.headers | grep -qi '^x-robots-tag: noindex, nofollow$'
          grep -Fq '/css/auth-patch38.css' /tmp/finobra-login.html
          grep -Fq '/js/auth-route-patch38.js' /tmp/finobra-login.html

          check_route 'https://finobra.app.br/cadastro' 'signup-shell' 'id="register-modal"' 'finobra-signup'
          tr -d '\r' < /tmp/finobra-signup.headers | grep -qi '^x-robots-tag: noindex, nofollow$'

          check_route 'https://finobra.app.br/app/dashboard' 'app-shell' '<div id="app-root"></div>' 'finobra-app'
          tr -d '\r' < /tmp/finobra-app.headers | grep -qi '^x-robots-tag: noindex, nofollow$'

          check_document 'https://finobra.app.br/privacidade' 'Política de Privacidade' 'finobra-privacy'
          check_document 'https://finobra.app.br/termos' 'Termos de Serviço' 'finobra-terms'
          check_document 'https://finobra.app.br/validar' 'Portal de Validação de Registros de Assinatura' 'finobra-validate'

          robots="$(curl --fail --silent --show-error https://finobra.app.br/robots.txt)"
          [[ "$robots" == *'Disallow: /login'* ]]
          [[ "$robots" == *'Disallow: /cadastro'* ]]
          [[ "$robots" == *'Sitemap: https://finobra.app.br/sitemap.xml'* ]]

          sitemap="$(curl --fail --silent --show-error https://finobra.app.br/sitemap.xml)"
          [[ "$sitemap" == *'<loc>https://finobra.app.br/</loc>'* ]]
          [[ "$sitemap" == *'<loc>https://finobra.app.br/privacidade</loc>'* ]]
          [[ "$sitemap" == *'<loc>https://finobra.app.br/termos</loc>'* ]]
          [[ "$sitemap" != *'/login'* ]]
          [[ "$sitemap" != *'/cadastro'* ]]
          [[ "$sitemap" != *'/app'* ]]

          echo "Production smoke test passed for commit $GITHUB_SHA with Patch 38 public-route contracts."
