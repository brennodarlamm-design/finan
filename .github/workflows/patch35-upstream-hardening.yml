name: Patch 35 upstream timeout hardening (no deploy)

on:
  push:
    branches:
      - patch35-large-audit
    paths:
      - .github/workflows/patch35-upstream-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch35-large-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Harden NF-e, WhatsApp and OCR upstream handling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # ── NF-e / CNPJ / CEP ─────────────────────────────────────────────
          path = Path('api/nfe.js')
          text = path.read_text()

          old = """      const response = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpjLimpo}`, {\n        headers: { 'Accept': 'application/json', 'User-Agent': 'FinObra/1.0' }\n      });"""
          new = """      const response = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpjLimpo}`, {\n        headers: { 'Accept': 'application/json', 'User-Agent': 'FinObra/1.0' },\n        signal: AbortSignal.timeout(7000)\n      });"""
          if text.count(old) != 1: raise SystemExit('CNPJ fetch esperado não encontrado.')
          text = text.replace(old, new, 1)

          old = """    } catch (err) {\n      return res.status(502).json({ error: 'Erro ao consultar Receita Federal', detail: err.message });\n    }"""
          new = """    } catch (err) {\n      console.warn('[CNPJ] Falha ao consultar BrasilAPI:', err?.name || 'Error', err?.message || err);\n      return res.status(502).json({ error: 'Não foi possível consultar o CNPJ no momento.' });\n    }"""
          if text.count(old) != 1: raise SystemExit('Catch CNPJ esperado não encontrado.')
          text = text.replace(old, new, 1)

          old = """    } catch (errCep) {\n      return res.status(502).json({ success: false, error: 'Falha ao consultar serviço de CEP.', detail: errCep.message });\n    }"""
          new = """    } catch (errCep) {\n      console.warn('[CEP] Falha nos provedores de CEP:', errCep?.name || 'Error', errCep?.message || errCep);\n      return res.status(502).json({ success: false, error: 'Falha ao consultar serviço de CEP.' });\n    }"""
          if text.count(old) != 1: raise SystemExit('Catch CEP esperado não encontrado.')
          text = text.replace(old, new, 1)

          replacements = [
            ("""      const mdResp = await fetch(`${MEUDANFE_BASE}/fd/add/${chave}`, {\n        method: 'PUT',\n        headers: mdHeaders\n      });""",
             """      const mdResp = await fetch(`${MEUDANFE_BASE}/fd/add/${chave}`, {\n        method: 'PUT',\n        headers: mdHeaders,\n        signal: AbortSignal.timeout(15000)\n      });"""),
            ("""      const mdResp = await fetch(`${MEUDANFE_BASE}/fd/get/da/${chave}`, {\n        method: 'GET',\n        headers: mdHeaders\n      });""",
             """      const mdResp = await fetch(`${MEUDANFE_BASE}/fd/get/da/${chave}`, {\n        method: 'GET',\n        headers: mdHeaders,\n        signal: AbortSignal.timeout(15000)\n      });"""),
            ("""      const mdResp = await fetch(`${MEUDANFE_BASE}/fd/get/xml/${chave}`, {\n        method: 'GET',\n        headers: mdHeaders\n      });""",
             """      const mdResp = await fetch(`${MEUDANFE_BASE}/fd/get/xml/${chave}`, {\n        method: 'GET',\n        headers: mdHeaders,\n        signal: AbortSignal.timeout(15000)\n      });"""),
            ("""      const mdResp = await fetch(`${MEUDANFE_BASE}/fd/my/NFE${qs}`, {\n        method: 'GET',\n        headers: mdHeaders\n      });""",
             """      const mdResp = await fetch(`${MEUDANFE_BASE}/fd/my/NFE${qs}`, {\n        method: 'GET',\n        headers: mdHeaders,\n        signal: AbortSignal.timeout(15000)\n      });"""),
            ("""      const mdResp = await fetch(`${MEUDANFE_BASE}/fd/add/sefaz-xml`, {\n        method: 'PUT',\n        headers: { ...mdHeaders, 'Content-Type': 'text/plain' },\n        body: xmlString\n      });""",
             """      const mdResp = await fetch(`${MEUDANFE_BASE}/fd/add/sefaz-xml`, {\n        method: 'PUT',\n        headers: { ...mdHeaders, 'Content-Type': 'text/plain' },\n        body: xmlString,\n        signal: AbortSignal.timeout(20000)\n      });""")
          ]
          for old, new in replacements:
              if text.count(old) != 1: raise SystemExit('Fetch MeuDanfe esperado não encontrado de forma única.')
              text = text.replace(old, new, 1)

          old = """  } catch (err) {\n    console.error('Erro no proxy serverless de NF-e:', err);\n    return res.status(500).json({ success: false, error: 'Erro ao comunicar com serviço de NF-e.', detail: err.message });\n  }"""
          new = """  } catch (err) {\n    console.error('Erro no proxy serverless de NF-e:', err);\n    const timedOut = err?.name === 'TimeoutError' || err?.name === 'AbortError';\n    return res.status(502).json({\n      success: false,\n      error: timedOut ? 'O serviço de NF-e demorou além do limite. Tente novamente.' : 'Erro ao comunicar com serviço de NF-e.'\n    });\n  }"""
          if text.count(old) != 1: raise SystemExit('Catch final NF-e esperado não encontrado.')
          text = text.replace(old, new, 1)
          path.write_text(text)

          # ── WhatsApp proxy ────────────────────────────────────────────────
          path = Path('api/whatsapp.js')
          text = path.read_text()
          old = """      } catch (err) {\n        return res.status(500).json({\n          success: false,\n          error: 'Falha ao solicitar desconexão ao servidor Render: ' + err.message\n        });\n      }"""
          new = """      } catch (err) {\n        console.warn('[WhatsApp] Falha ao solicitar reset no Render:', err?.name || 'Error', err?.message || err);\n        return res.status(502).json({\n          success: false,\n          error: 'Não foi possível desconectar o WhatsApp no momento. Tente novamente.'\n        });\n      }"""
          if text.count(old) != 1: raise SystemExit('Catch reset WhatsApp esperado não encontrado.')
          text = text.replace(old, new, 1)

          old = """        return res.status(response.status).json({\n          success: false,\n          error: data.error || 'Erro ao enviar mensagem de teste',\n          details: data\n        });"""
          new = """        return res.status(response.status).json({\n          success: false,\n          error: data.error || 'Erro ao enviar mensagem de teste'\n        });"""
          if text.count(old) != 1: raise SystemExit('Details teste WhatsApp esperado não encontrado.')
          text = text.replace(old, new, 1)

          old = """        return res.status(response.status).json({ success: false, error: data.error || 'Erro no envio pelo servidor WhatsApp', details: data });"""
          new = """        return res.status(response.status).json({ success: false, error: data.error || 'Erro no envio pelo servidor WhatsApp' });"""
          if text.count(old) != 1: raise SystemExit('Details envio WhatsApp esperado não encontrado.')
          text = text.replace(old, new, 1)

          old = """  } catch (err) {\n    return res.status(500).json({ success: false, error: err.message });\n  }"""
          new = """  } catch (err) {\n    console.error('[WhatsApp] Falha inesperada no proxy:', err);\n    const timedOut = err?.name === 'TimeoutError' || err?.name === 'AbortError';\n    return res.status(502).json({\n      success: false,\n      error: timedOut ? 'O servidor do WhatsApp demorou além do limite. Tente novamente.' : 'Não foi possível concluir a operação do WhatsApp.'\n    });\n  }"""
          if text.count(old) != 1: raise SystemExit('Catch final WhatsApp esperado não encontrado.')
          text = text.replace(old, new, 1)
          path.write_text(text)

          # ── OCR / IA ─────────────────────────────────────────────────────
          path = Path('api/reconhecer-documento.js')
          text = path.read_text()
          old = """    if (!ocrResult) {\n      const mensagens = [];\n      if (openaiErrorDetail) {\n        if (/credit_balance_exhausted|insufficient_quota/i.test(openaiErrorDetail)) {\n          mensagens.push('OpenAI ChatGPT: Créditos esgotados na sua conta OpenAI. Adicione créditos em platform.openai.com/settings/organization/billing.');\n        } else {\n          mensagens.push(`OpenAI ChatGPT: ${openaiErrorDetail}`);\n        }\n      }\n      if (geminiErrorDetail) {\n        mensagens.push(`Google Gemini: ${geminiErrorDetail}`);\n      }\n      const erroConsolidado = mensagens.join(' | ') || 'Nenhum dos provedores de IA conseguiu processar o arquivo.';\n      console.error('[OCR] Falha geral de OCR:', erroConsolidado);\n      return res.status(502).json({\n        error: 'Erro no reconhecimento do documento pelos motores de IA.',\n        detalhe: erroConsolidado,\n        openai: openaiErrorDetail || null,\n        gemini: geminiErrorDetail || null\n      });\n    }"""
          new = """    if (!ocrResult) {\n      const quotaExceeded = /credit_balance_exhausted|insufficient_quota/i.test(String(openaiErrorDetail || ''));\n      console.error('[OCR] Falha geral de OCR:', {\n        openai: openaiErrorDetail || null,\n        gemini: geminiErrorDetail || null\n      });\n      return res.status(502).json({\n        error: quotaExceeded\n          ? 'O serviço de IA atingiu o limite de uso no momento. Tente novamente mais tarde.'\n          : 'Nenhum dos motores de IA conseguiu processar o documento no momento. Tente novamente.'\n      });\n    }"""
          if text.count(old) != 1: raise SystemExit('Bloco de falha OCR esperado não encontrado.')
          text = text.replace(old, new, 1)

          old = """  } catch (err) {\n    console.error('[OCR] Erro inesperado:', err);\n    return res.status(500).json({ error: 'Erro interno ao processar o documento.', detalhe: err.message });\n  }"""
          new = """  } catch (err) {\n    console.error('[OCR] Erro inesperado:', err);\n    return res.status(500).json({ error: 'Erro interno ao processar o documento.' });\n  }"""
          if text.count(old) != 1: raise SystemExit('Catch final OCR esperado não encontrado.')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Validate regression and syntax
        run: |
          npm test
          node scripts/check-all-syntax.js
      - name: Verify upstream timeout and error boundaries
        run: |
          test "$(grep -c "AbortSignal.timeout(15000)" api/nfe.js)" -ge 4
          grep -q "AbortSignal.timeout(20000)" api/nfe.js
          grep -q "AbortSignal.timeout(7000)" api/nfe.js
          ! grep -q "detail: err.message\|detail: errCep.message" api/nfe.js
          ! grep -q "error: err.message\|details: data" api/whatsapp.js
          ! grep -q "detalhe: err.message\|openai: openaiErrorDetail\|gemini: geminiErrorDetail" api/reconhecer-documento.js
      - name: Commit upstream hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/nfe.js api/whatsapp.js api/reconhecer-documento.js
          git diff --cached --check
          git commit -m "fix(patch35): bound upstream calls and sanitize provider errors"
          git push origin HEAD:patch35-large-audit
