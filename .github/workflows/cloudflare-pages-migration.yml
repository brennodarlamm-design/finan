name: Cloudflare Pages migration

on:
  push:
    branches:
      - cloudflare-pages-migration-20260912
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and apply build transforms
        run: npm ci
      - name: Build Cloudflare Pages frontend
        run: npm run build:cloudflare
      - name: Validate Pages Function syntax
        run: node --check 'functions/api/[[path]].js'
      - name: Validate frontend-only dist
        run: |
          test -f dist/index.html
          test -f dist/app.html
          test -f dist/_headers
          test -f dist/_redirects
          test -f dist/_routes.json
          test -f dist/js/patch26-events.js
          grep -q 'FINOBRA_PATCH26_LEXICAL_ROOTS_HOTFIX' dist/js/patch26-events.js
          grep -q "typeof Clientes !== 'undefined' ? Clientes" dist/js/patch26-events.js
          test ! -e dist/api
          test ! -e dist/backend
          test ! -e dist/bin
          test ! -e dist/.git
          echo 'Cloudflare Pages build validated.'

      - name: Discover Cloudflare Pages project
        if: github.event_name == 'pull_request'
        id: pages_project
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_API_TOKEN" ]]
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]]
          npx --yes wrangler pages project list --json > /tmp/pages-projects.json
          cat /tmp/pages-projects.json
          PROJECT_NAME="$(node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw=JSON.parse(fs.readFileSync('/tmp/pages-projects.json','utf8'));
          const projects=Array.isArray(raw)?raw:(Array.isArray(raw?.result)?raw.result:[]);
          const names=projects.map(p=>String(p.name||p.project_name||'')).filter(Boolean);
          const exact=names.filter(n=>/^(finan|finobra|fingo)$/i.test(n));
          const fuzzy=names.filter(n=>/(finan|finobra|fingo)/i.test(n));
          const candidates=exact.length===1?exact:(exact.length===0&&fuzzy.length===1?fuzzy:[]);
          if(candidates.length!==1){
            console.error('Could not identify one FinGo/FinObra Pages project safely. Available: '+names.join(', '));
            process.exit(3);
          }
          process.stdout.write(candidates[0]);
          NODE
          )"
          echo "name=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo "Cloudflare Pages project: $PROJECT_NAME"

      - name: Deploy Cloudflare Pages preview
        if: github.event_name == 'pull_request'
        id: pages_preview
        shell: bash
        env:
          PROJECT_NAME: ${{ steps.pages_project.outputs.name }}
          PREVIEW_BRANCH: ${{ github.event.pull_request.head.ref }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          OUTPUT="$(npx --yes wrangler pages deploy dist             --project-name "$PROJECT_NAME"             --branch "$PREVIEW_BRANCH"             --commit-hash "$PREVIEW_SHA"             --commit-message "PR ${{ github.event.pull_request.number }} preview: $PREVIEW_SHA" 2>&1 | tee /dev/stderr)"
          URL="$(printf '%s\n' "$OUTPUT" | grep -Eo 'https://[a-zA-Z0-9._-]+\.pages\.dev' | tail -n 1 || true)"
          [[ -n "$URL" ]] || { echo "::error::Wrangler did not return a pages.dev preview URL."; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test Cloudflare Pages preview
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.pages_preview.outputs.url }}
        run: |
          set -euo pipefail
          status=''
          for attempt in {1..12}; do
            status="$(curl --silent --show-error --location --output /tmp/cloudflare-preview.html --write-out '%{http_code}' "$PREVIEW_URL/" || true)"
            [[ "$status" == '200' ]] && break
            echo "Waiting for preview propagation ($attempt/12)..."
            sleep 5
          done
          [[ "$status" == '200' ]]
          grep -Eq 'FinGo|FinObra|Sua obra sob controle' /tmp/cloudflare-preview.html
          curl --silent --show-error --head "$PREVIEW_URL/" | tr -d '\r' | grep -qi '^x-robots-tag: noindex'
          echo "Cloudflare Pages preview ready: $PREVIEW_URL"
