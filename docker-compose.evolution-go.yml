version: '3.8'

# FinGo — Orquestração de Infraestrutura do Evolution Go (Golang WhatsApp Engine)
# Documentação oficial: https://docs.evolutionfoundation.com.br/evolution-go/installation
# Imagem oficial: evoapicloud/evolution-go:latest

services:
  evolution-go:
    image: evoapicloud/evolution-go:latest
    container_name: fingo-evolution-go
    restart: unless-stopped
    ports:
      - "${EVOLUTION_GO_PORT:-8085}:8080"
    environment:
      # Porta interna do servidor HTTP Golang
      - SERVER_PORT=8080
      # Identificador do cliente no Evolution Go
      - CLIENT_NAME=fingo
      # Chave de API Global para proteger a comunicação com o FinGo
      - GLOBAL_API_KEY=${EVOLUTION_GO_API_KEY:-fingo-evo-secret-change-me-in-production}
      # Banco de dados Neon / PostgreSQL para persistência segura de sessões e credenciais
      # Exemplo Neon: postgresql://user:pass@ep-xyz.us-east-2.aws.neon.tech/neondb?sslmode=require
      - POSTGRES_AUTH_DB=${POSTGRES_AUTH_DB:-postgresql://postgres:postgres@postgres:5432/evogo_auth?sslmode=disable}
      - POSTGRES_USERS_DB=${POSTGRES_USERS_DB:-postgresql://postgres:postgres@postgres:5432/evogo_users?sslmode=disable}
      # Desativa gravação de mensagens para manter o banco leve (foco exclusivo em sessões e envio)
      - DATABASE_SAVE_MESSAGES=false
      # Nível de logs do WhatsApp: DEBUG, INFO, WARN, ERROR
      - WADEBUG=INFO
      - LOGTYPE=console
      # Reconecta automaticamente as instâncias quando o container subir
      - CONNECT_ON_STARTUP=true
      # Webhooks para receber mensagens e comprovantes no FinBot
      - WEBHOOKFILES=true
      - WEBHOOK_URL=${EVOLUTION_GO_WEBHOOK_URL:-http://host.docker.internal:3333/api/whatsapp?action=webhook}
    networks:
      - fingo-network

networks:
  fingo-network:
    driver: bridge
