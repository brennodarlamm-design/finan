name: Patch 36 block 1 - core product rules

on:
  push:
    branches:
      - patch36-product-experience
    paths:
      - scripts/patch36-block1.mjs
      - .github/workflows/patch36-block1.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch36-product-experience
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Patch 36 block 1
        run: node scripts/patch36-block1.mjs
      - name: Vendor Chart.js 4.4.0 locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p js/vendor
          curl --fail --location --silent --show-error \
            https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js \
            --output js/vendor/chart.umd.min.js
          test -s js/vendor/chart.umd.min.js
          test "$(wc -c < js/vendor/chart.umd.min.js)" -gt 100000
      - name: Full regression suite
        run: npm test
      - name: Syntax verification
        run: node scripts/check-all-syntax.js
      - name: Cloudflare build dry validation
        run: |
          npm run build:cloudflare
          npx --yes wrangler deploy --dry-run
      - name: Commit validated block
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "finobra-patch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/_plans.js api/_permissions.js api/users.js api/plano.js api/admin.js app.html cloudflare-worker.js js/vendor/chart.umd.min.js scripts/test-patch36-static.js scripts/test-static-all.js
          if git diff --cached --quiet; then
            echo "No functional changes to commit."
            exit 0
          fi
          git commit -m "feat(patch36): plans users modules master recovery and local charts"
          git push origin HEAD:patch36-product-experience
