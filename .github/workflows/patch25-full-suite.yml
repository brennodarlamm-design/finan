name: FinGo full test suite

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - patch25-csp-events-20260912
      - security-audit-p50

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Run full FinGo test suite
        run: npm test
      - name: Syntax verification
        run: node scripts/check-all-syntax.js
