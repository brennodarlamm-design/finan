name: FinObra security regression

on:
  push:
    branches:
      - main
      - patch26-csp-global-20260912
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  full-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run full FinObra test suite
        run: npm test
      - name: Syntax verification
        run: node scripts/check-all-syntax.js
