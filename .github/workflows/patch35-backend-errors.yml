name: Patch 35 backend error hardening (no deploy)

on:
  push:
    branches:
      - patch35-large-audit
    paths:
      - .github/workflows/patch35-backend-errors.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch35-large-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Remove internal error leakage and contain async cron route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('backend/server.js')
          text = path.read_text()

          send_old = """  } catch (err) {\n    console.error('❌ Erro ao enviar mensagem:', err);\n    return res.status(500).json({ error: err.message });\n  }\n});"""
          send_new = """  } catch (err) {\n    console.error('❌ Erro ao enviar mensagem:', err);\n    return res.status(500).json({ error: 'Não foi possível enviar a mensagem pelo WhatsApp no momento.' });\n  }\n});"""
          if text.count(send_old) != 1:
              raise SystemExit('Bloco /send-message esperado não encontrado de forma única.')
          text = text.replace(send_old, send_new, 1)

          neon_old = """  } catch (err) {\n    return res.status(500).json({ success: false, error: err.message });\n  }\n});\n\nfunction formatDateBR"""
          neon_new = """  } catch (err) {\n    console.error('❌ [Neon] Falha no teste autenticado de conexão:', err);\n    return res.status(500).json({ success: false, error: 'Não foi possível consultar o banco de dados no momento.' });\n  }\n});\n\nfunction formatDateBR"""
          if text.count(neon_old) != 1:
              raise SystemExit('Bloco /test-neon esperado não encontrado de forma única.')
          text = text.replace(neon_old, neon_new, 1)

          cron_old = """app.post('/cron/daily-summary', requireAuth, async (req, res) => {\n  const tenantId = req.body?.tenantId || req.query?.tenant_id || null;\n  await executarResumoMatinal(tenantId);\n  return res.json({ success: true, message: 'Rotina matinal executada!' });\n});"""
          cron_new = """app.post('/cron/daily-summary', requireAuth, async (req, res) => {\n  const tenantId = req.body?.tenantId || req.query?.tenant_id || null;\n  try {\n    await executarResumoMatinal(tenantId);\n    return res.json({ success: true, message: 'Rotina matinal executada!' });\n  } catch (err) {\n    console.error('❌ [Cron] Falha na execução manual do resumo matinal:', err);\n    return res.status(500).json({ success: false, error: 'Não foi possível executar a rotina matinal no momento.' });\n  }\n});"""
          if text.count(cron_old) != 1:
              raise SystemExit('Bloco /cron/daily-summary esperado não encontrado de forma única.')
          text = text.replace(cron_old, cron_new, 1)
          path.write_text(text)
          PY
      - name: Validate regression, syntax and backend dependencies
        run: |
          npm test
          node scripts/check-all-syntax.js
          cd backend
          npm ci
          npm audit --omit=dev --audit-level=moderate
      - name: Ensure raw backend errors are not returned by hardened routes
        run: |
          if grep -n "json({ error: err.message\|json({ success: false, error: err.message" backend/server.js; then
            echo 'Erro interno ainda exposto diretamente.'
            exit 1
          fi
      - name: Commit backend error hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/server.js
          git diff --cached --check
          git commit -m "fix(patch35): contain backend errors and async cron failures"
          git push origin HEAD:patch35-large-audit
