name: Patch 37 Block 2

on:
  push:
    branches:
      - patch37-commercial-account-release
    paths:
      - 'scripts/patch37-block2*.mjs'
      - '.github/workflows/patch37-block2.yml'

permissions:
  contents: write

concurrency:
  group: patch37-block2
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch37-commercial-account-release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Patch 37 block 2
        run: node scripts/patch37-block2.mjs
      - name: Full regression suite
        run: npm test
      - name: Syntax verification
        run: node scripts/check-all-syntax.js
      - name: Dependency audits
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=high
          npm --prefix backend audit --audit-level=high
      - name: Build Cloudflare assets
        run: npm run build:cloudflare
      - name: Wrangler dry-run
        run: npx --yes wrangler deploy --dry-run
      - name: Verify plan/account invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "code:'PLAN_FEATURE_LOCKED'" api/_plans.js
          grep -q "code:'PLAN_MODULE_LOCKED'" api/_plans.js
          grep -q 'requiredPlanLabel' api/users.js
          grep -q 'Equipe & Sessões' js/cobranca.js
          grep -q 'Cobranca.openSettingsTab' js/patch26-events.js
      - name: Commit validated block
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          git config user.name 'finobra-patch-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No functional changes to commit.'
            exit 0
          fi
          git commit -m 'feat(patch37): unify plan upgrades account team and support'
          git push origin HEAD:patch37-commercial-account-release
