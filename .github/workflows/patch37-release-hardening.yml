name: Patch 37 Release Hardening

on:
  push:
    branches:
      - patch37-commercial-account-release
    paths:
      - 'scripts/patch37-release-hardening.mjs'
      - '.github/workflows/patch37-release-hardening.yml'

permissions:
  contents: write

concurrency:
  group: patch37-release-hardening
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch37-commercial-account-release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply release hardening
        run: node scripts/patch37-release-hardening.mjs
      - name: Full regression suite
        run: npm test
      - name: Syntax verification
        run: node scripts/check-all-syntax.js
      - name: Dependency audits
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=high
          npm --prefix backend audit --audit-level=high
      - name: Build Cloudflare assets
        run: npm run build:cloudflare
      - name: Wrangler dry-run
        run: npx --yes wrangler deploy --dry-run
      - name: Verify release hardening invariants
        run: node scripts/test-patch37-release-hardening-static.js
      - name: Commit validated release hardening
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          git config user.name 'finobra-patch-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No functional changes to commit.'
            exit 0
          fi
          git commit -m 'feat(patch37): harden master support and atomic release gate'
          git push origin HEAD:patch37-commercial-account-release
