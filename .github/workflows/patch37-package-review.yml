name: Patch 37 Review Package

on:
  push:
    branches:
      - patch37-commercial-account-release
    paths:
      - '.github/workflows/patch37-package-review.yml'

permissions:
  contents: read

jobs:
  package-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch37-commercial-account-release
          fetch-depth: 1

      - name: Build review package
        shell: bash
        run: |
          set -euo pipefail
          cat > LEIA-ME_PATCH37.txt <<'EOF'
          FINOBRA — PATCH 37 (PACOTE PARA REVISÃO)
          ========================================

          Branch: patch37-commercial-account-release
          SHA funcional empacotado: de39090effee8c2702754eda974817c3d554884e
          Situação: EM DESENVOLVIMENTO / NÃO PUBLICADO EM PRODUÇÃO

          OBJETIVO DO PATCH 37
          --------------------
          Consolidar a experiência comercial, Conta & Assinatura, mobile, Master/impersonação e preparar release atômico backend + frontend.

          JÁ CONCLUÍDO E VALIDADO
          -----------------------
          1. Arquitetura pública planejada:
             - /            -> Landing comercial
             - /login       -> Login
             - /cadastro    -> Cadastro / teste grátis
             - /app/*       -> Aplicação autenticada

          2. CSP / eventos:
             - Auditoria global de ações data-fb-* contra allowlist do patch26-events.
             - Cobertura permanente para evitar botões novos bloqueados pela CSP.

          3. Conta & Assinatura:
             - Visão geral do plano.
             - Uso de usuários e obras.
             - Módulos incluídos/bloqueados.
             - Cobranças e competência.
             - Equipe & Sessões.
             - Suporte / Comercial.

          4. Planos:
             - Básico: 1 usuário.
             - Profissional: 2 usuários.
             - Ilimitado: 5 usuários.
             - Bloqueios por plano e mensagens de upgrade.

          5. Mobile:
             - Ajustes para 360–430 px.
             - Safe-area.
             - Modais tipo bottom-sheet.
             - Usuários e sessões em cards.
             - Botões e formulários adaptados para toque.

          6. Validações já executadas nos Blocos 1–3:
             - Regressão completa.
             - Sintaxe JavaScript.
             - npm audit raiz/backend.
             - Build Cloudflare.
             - Wrangler --dry-run.

          AINDA PENDENTE
          --------------
          - Bloco 4: Master / impersonação / retorno seguro.
          - Bloco 5: release atômico Vercel -> Cloudflare.
          - Limpeza final de workflows/scripts temporários do Patch 37.
          - Regressão final de fechamento.
          - Merge na main.
          - Deploy único de produção.

          COMO RODAR LOCALMENTE
          ---------------------
          Requisitos:
          - Node.js 22
          - npm

          Na raiz do projeto:

            npm ci
            npm test
            npm run build:cloudflare

          Para servir os arquivos localmente:

            npm run dev

          ATENÇÃO
          -------
          - Este pacote é para revisão do código atual do Patch 37.
          - Não usar como release final de produção.
          - Não executar deploy de Vercel/Cloudflare a partir deste pacote sem fechar os blocos pendentes.
          - Arquivos sensíveis (.env, .git, chaves privadas, certificados e logs) não devem estar presentes no pacote.

          FIM
          EOF

          node scripts/package-release.js
          ZIP_FILE=$(ls -1 FINOBRA_RELEASE_v*.zip | head -n 1)
          mv "$ZIP_FILE" FinObra_Patch37_Review.zip

      - name: Upload review package
        uses: actions/upload-artifact@v4
        with:
          name: patch37-review-package
          path: |
            FinObra_Patch37_Review.zip
            LEIA-ME_PATCH37.txt
          if-no-files-found: error
          retention-days: 3
