name: FinGo CI / manual Cloudflare production deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Confirmar deploy em producao'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fingo-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full regression suite
        run: npm test
      - name: Syntax verification
        run: node scripts/check-all-syntax.js
      - name: Build Cloudflare static assets
        run: npm run build:cloudflare
      - name: Validate Wrangler bundle
        run: npx --yes wrangler deploy --dry-run

  deploy-cloudflare:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.deploy_production == true) ||
        (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[deploy-production]'))
      )
    needs: validate
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Cloudflare deploy credentials
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials detected; manual production deploy enabled."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID before production deploy."
            exit 1
          fi
      - name: Build production assets
        run: npm run build:cloudflare
      - name: Deploy Worker and static assets
        run: npm run deploy:cloudflare
      - name: Post-deploy smoke test
        shell: bash
        run: |
          set -euo pipefail

          health=''
          for attempt in {1..12}; do
            health="$(curl --fail --silent --show-error https://fingo.api.br/__finobra/health || true)"
            if [[ "$health" == *'"ok":true'* && \
                  "$health" == *'"securityMode":"nonce-csp"'* && \
                  "$health" == *'"loopRisk":false'* && \
                  "$health" == *'"deploymentMetadataOk":true'* && \
                  "$health" == *"\"commit\":\"$GITHUB_SHA\""* ]]; then
              break
            fi
            echo "Waiting for Cloudflare propagation (${attempt}/12)..."
            sleep 5
          done

          [[ "$health" == *'"ok":true'* ]]
          [[ "$health" == *'"securityMode":"nonce-csp"'* ]]
          [[ "$health" == *'"loopRisk":false'* ]]
          [[ "$health" == *'"deploymentMetadataOk":true'* ]]
          [[ "$health" == *"\"commit\":\"$GITHUB_SHA\""* ]]

          version="$(curl --fail --silent --show-error https://fingo.api.br/version.json)"
          [[ "$version" == *"\"commit\":\"$GITHUB_SHA\""* ]]
          [[ "$version" == *'"source":"github-actions"'* ]]

          edge_api_health="$(curl --fail --silent --show-error 'https://fingo.api.br/api/v2/system/health')"
          [[ "$edge_api_health" == *'"ok":true'* ]]
          [[ "$edge_api_health" == *'"service":"fingo-edge-v2"'* ]]
          [[ "$edge_api_health" == *'"runtime":"cloudflare-workers"'* ]]

          auth_status="$(curl --silent --output /dev/null --write-out '%{http_code}' 'https://fingo.api.br/api/auth?action=me')"
          [[ "$auth_status" == '401' ]]

          check_route() {
            local url="$1"
            local expected_route="$2"
            local expected_text="$3"
            local prefix="$4"
            local status

            status="$(curl --silent --show-error --dump-header "/tmp/${prefix}.headers" --output "/tmp/${prefix}.html" --write-out '%{http_code}' "$url")"
            [[ "$status" == '200' ]]
            tr -d '\r' < "/tmp/${prefix}.headers" | grep -qi "^x-finobra-route: ${expected_route}$"
            grep -Fq "$expected_text" "/tmp/${prefix}.html"
          }

          check_document() {
            local url="$1"
            local expected_text="$2"
            local prefix="$3"
            local status

            status="$(curl --silent --show-error --output "/tmp/${prefix}.html" --write-out '%{http_code}' "$url")"
            [[ "$status" == '200' ]]
            grep -Fq "$expected_text" "/tmp/${prefix}.html"
          }

          check_route 'https://fingo.api.br/' 'landing-shell' 'class="ui-marketing"' 'fingo-home'
          grep -Fq '<link rel="canonical" href="https://fingo.api.br/">' /tmp/fingo-home.html

          check_route 'https://fingo.api.br/login' 'login-shell' 'id="login-form"' 'fingo-login'
          tr -d '\r' < /tmp/fingo-login.headers | grep -qi '^x-robots-tag: noindex, nofollow$'
          grep -Fq '/css/auth-patch38.css' /tmp/fingo-login.html
          grep -Fq '/js/auth-route-patch38.js' /tmp/fingo-login.html

          check_route 'https://fingo.api.br/cadastro' 'signup-shell' 'id="register-modal"' 'fingo-signup'
          tr -d '\r' < /tmp/fingo-signup.headers | grep -qi '^x-robots-tag: noindex, nofollow$'

          check_route 'https://fingo.api.br/app/dashboard' 'app-shell' '<div id="app-root"></div>' 'fingo-app'
          tr -d '\r' < /tmp/fingo-app.headers | grep -qi '^x-robots-tag: noindex, nofollow$'

          check_route 'https://fingo.api.br/master' 'master-shell' 'id="master-auth-gate"' 'fingo-master'
          tr -d '\r' < /tmp/fingo-master.headers | grep -qi '^x-robots-tag: noindex, nofollow$'
          check_document 'https://fingo.api.br/js/master_page.js' 'ensureDevTenantKeysModule' 'fingo-master-page-js'
          check_document 'https://fingo.api.br/js/dev-tenant-keys.js' 'Chaves das Empresas — DEV / Master' 'fingo-dev-tenant-keys-js'

          check_document 'https://fingo.api.br/privacidade' 'Política de Privacidade' 'fingo-privacy'
          check_document 'https://fingo.api.br/termos' 'Termos de Serviço' 'fingo-terms'
          check_document 'https://fingo.api.br/validar' 'Validação de Autenticidade Digital' 'fingo-validate'

          robots="$(curl --fail --silent --show-error https://fingo.api.br/robots.txt)"
          [[ "$robots" == *'Disallow: /login'* ]]
          [[ "$robots" == *'Disallow: /cadastro'* ]]
          [[ "$robots" == *'Sitemap: https://fingo.api.br/sitemap.xml'* ]]

          sitemap="$(curl --fail --silent --show-error https://fingo.api.br/sitemap.xml)"
          [[ "$sitemap" == *'<loc>https://fingo.api.br/</loc>'* ]]
          [[ "$sitemap" == *'<loc>https://fingo.api.br/privacidade</loc>'* ]]
          [[ "$sitemap" == *'<loc>https://fingo.api.br/termos</loc>'* ]]
          [[ "$sitemap" != *'/login'* ]]
          [[ "$sitemap" != *'/cadastro'* ]]
          [[ "$sitemap" != *'/app'* ]]

          echo "Cloudflare production smoke test passed for commit $GITHUB_SHA with Edge API, security and Master vault contracts."
