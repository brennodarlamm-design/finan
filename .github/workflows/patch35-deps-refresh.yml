name: Patch 35 backend dependency refresh (no deploy)

on:
  push:
    branches:
      - patch35-large-audit
    paths:
      - .github/workflows/patch35-deps-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch35-large-audit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Harden backend dependencies and cron scheduler
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          pkg_path = Path('backend/package.json')
          pkg = json.loads(pkg_path.read_text())
          pkg['dependencies']['express'] = '^4.22.2'
          pkg['dependencies']['node-cron'] = '^4.6.0'
          pkg['overrides'] = {**pkg.get('overrides', {}), 'qs': '6.16.0'}
          pkg_path.write_text(json.dumps(pkg, ensure_ascii=False, indent=2) + '\n')

          server_path = Path('backend/server.js')
          server = server_path.read_text()

          old_daily = """// Agendado para 08:00 no fuso America/Boa_Vista (12:00 UTC; sem horário de verão)\ncron.schedule('0 12 * * *', () => {\n  executarResumoMatinal();\n});"""
          new_daily = """// Agendado para 08:00 no fuso explícito de Boa Vista.\n// Patch 35: evita sobreposição e captura rejeições assíncronas do ciclo completo.\ncron.schedule('0 8 * * *', async () => {\n  try {\n    await executarResumoMatinal();\n  } catch (err) {\n    console.error('❌ [Cron] Falha no resumo matinal:', err?.message || err);\n  }\n}, {\n  timezone: 'America/Boa_Vista',\n  noOverlap: true,\n  name: 'finobra-daily-summary'\n});"""
          if old_daily not in server:
              raise SystemExit('Bloco cron diário esperado não encontrado; abortando sem alterar silenciosamente.')
          server = server.replace(old_daily, new_daily, 1)

          old_ping = """cron.schedule('*/10 * * * *', async () => {\n  try {\n    const pingRes = await fetch(`${RENDER_EXTERNAL_URL}/health`);\n    console.log(`💓 [Keep-Alive] Ping no servidor (${pingRes.status})`);\n  } catch (pingErr) {\n    console.warn('⚠️ [Keep-Alive] Aviso no auto-ping:', pingErr.message);\n  }\n});"""
          new_ping = """cron.schedule('*/10 * * * *', async () => {\n  try {\n    const pingRes = await fetch(`${RENDER_EXTERNAL_URL}/health`);\n    console.log(`💓 [Keep-Alive] Ping no servidor (${pingRes.status})`);\n  } catch (pingErr) {\n    console.warn('⚠️ [Keep-Alive] Aviso no auto-ping:', pingErr.message);\n  }\n}, {\n  noOverlap: true,\n  name: 'finobra-keep-alive'\n});"""
          if old_ping not in server:
              raise SystemExit('Bloco keep-alive esperado não encontrado; abortando sem alterar silenciosamente.')
          server = server.replace(old_ping, new_ping, 1)
          server_path.write_text(server)
          PY
      - name: Regenerate deterministic backend lockfile
        working-directory: backend
        run: npm install --package-lock-only
      - name: Validate clean backend install
        working-directory: backend
        run: npm ci
      - name: Block moderate-or-higher dependency vulnerabilities
        working-directory: backend
        run: npm audit --omit=dev --audit-level=moderate
      - name: Validate backend syntax
        run: node --check backend/server.js
      - name: Commit refreshed backend security baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json backend/server.js
          git diff --cached --check
          git commit -m "fix(patch35): harden backend dependencies and cron scheduling"
          git push origin HEAD:patch35-large-audit
