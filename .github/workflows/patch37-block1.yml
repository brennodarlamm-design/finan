name: Patch 37 Block 1

on:
  push:
    branches:
      - patch37-commercial-account-release
    paths:
      - 'scripts/patch37-block1.mjs'
      - 'scripts/patch37-block1-fix.mjs'
      - '.github/workflows/patch37-block1.yml'

permissions:
  contents: write

concurrency:
  group: patch37-block1
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch37-commercial-account-release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Patch 37 block 1
        run: |
          node scripts/patch37-block1.mjs
          node scripts/patch37-block1-fix.mjs
      - name: Full regression suite
        run: npm test
      - name: Syntax verification
        run: node scripts/check-all-syntax.js
      - name: Dependency audit root
        run: npm audit --audit-level=high
      - name: Build Cloudflare assets
        run: npm run build:cloudflare
      - name: Wrangler dry-run
        run: npx --yes wrangler deploy --dry-run
      - name: Verify generated public shells
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Obras, financeiro e engenharia.' dist/index.html
          grep -q 'id="login-form"' dist/login.html
          grep -q 'Cobranca.switchAccountTab' js/patch26-events.js
          grep -q 'Cobranca.goToPlans' js/patch26-events.js
      - name: Commit validated block
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          git config user.name 'finobra-patch-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No functional changes to commit.'
            exit 0
          fi
          git commit -m 'feat(patch37): commercial routing csp coverage and release foundation'
          git push origin HEAD:patch37-commercial-account-release
