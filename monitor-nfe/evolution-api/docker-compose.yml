version: '3.8'

services:
  evolution-api:
    container_name: evolution_api_angelim
    image: atendai/evolution-api:v2.1.2
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=ANGELIM-FINANCAS-EVOLUTION-2026-KEY
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=local
      - CACHE_REDIS_ENABLED=false
      - WEBHOOK_GLOBAL_ENABLED=false
      - QRCODE_LIMIT=30
      - DEL_INSTANCE=false
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store

volumes:
  evolution_instances:
  evolution_store:
