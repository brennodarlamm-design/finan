services:
  - type: web
    name: angelim-backend
    runtime: node
    plan: free
    region: ohio
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 3333
      - key: DATABASE_URL
        sync: false
      - key: TARGET_PHONE
        value: 5595991363678
      - key: TARGET_TENANT_ID
        value: angelim
      - key: API_SECRET
        sync: false
