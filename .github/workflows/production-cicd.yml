name: FinGo CI / manual Cloudflare production deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Confirmar deploy em producao'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fingo-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full regression suite
        run: npm test
      - name: Syntax verification
        run: node scripts/check-all-syntax.js
      - name: Build Cloudflare static assets
        run: npm run build:cloudflare
      - name: Validate Wrangler bundle
        run: npx --yes wrangler deploy --dry-run

  deploy-cloudflare:
    if: >-
      github.ref == 'refs/heads/main' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.deploy_production == true) ||
        (github.event_name == 'push' && startsWith(github.event.head_commit.message, '[deploy-production]'))
      )
    needs: validate
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Cloudflare deploy credentials
        id: cloudflare
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials detected; manual production deploy enabled."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID before production deploy."
            exit 1
          fi
      - name: Apply required database migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "::error::Configure DATABASE_URL_UNPOOLED before production deploy."
            exit 1
          fi
          node scripts/run-migration.js migrations/033_newsletter_subscriptions.sql

      - name: Ensure R2 attachments bucket exists
        shell: bash
        run: |
          set -euo pipefail
          if npx wrangler r2 bucket list | grep -Fq 'fingo-attachments'; then
            echo "R2 bucket fingo-attachments already exists."
          else
            npx wrangler r2 bucket create fingo-attachments
          fi
      - name: Build production assets
        run: npm run build:cloudflare
      - name: Deploy Worker and static assets
        run: npm run deploy:cloudflare
      - name: Post-deploy smoke test
        shell: bash
        run: |
          set -euo pipefail

          MAX_ATTEMPTS=12
          RETRY_DELAY=5
          RETRY_BODY=''
          RETRY_STATUS=''

          retry_body_contains() {
            local label="$1"
            local url="$2"
            shift 2
            local attempt
            local marker
            local body
            local matched

            for ((attempt=1; attempt<=MAX_ATTEMPTS; attempt++)); do
              body="$(curl --fail --silent --show-error "$url" || true)"
              matched=true
              for marker in "$@"; do
                if [[ "$body" != *"$marker"* ]]; then
                  matched=false
                  break
                fi
              done

              if [[ "$matched" == true ]]; then
                RETRY_BODY="$body"
                echo "$label ready on attempt $attempt/$MAX_ATTEMPTS"
                return 0
              fi

              echo "Waiting for Cloudflare propagation: $label ($attempt/$MAX_ATTEMPTS)..."
              if (( attempt < MAX_ATTEMPTS )); then
                sleep "$RETRY_DELAY"
              fi
            done

            echo "::error::$label did not reach the expected deployment state after $MAX_ATTEMPTS attempts."
            echo "::error::$label last response: $body"
            return 1
          }

          retry_status_equals() {
            local label="$1"
            local url="$2"
            local expected="$3"
            local attempt
            local status

            for ((attempt=1; attempt<=MAX_ATTEMPTS; attempt++)); do
              status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$url" || true)"
              if [[ "$status" == "$expected" ]]; then
                RETRY_STATUS="$status"
                echo "$label ready on attempt $attempt/$MAX_ATTEMPTS (HTTP $status)"
                return 0
              fi

              echo "Waiting for Cloudflare propagation: $label ($attempt/$MAX_ATTEMPTS), got HTTP $status..."
              if (( attempt < MAX_ATTEMPTS )); then
                sleep "$RETRY_DELAY"
              fi
            done

            echo "::error::$label expected HTTP $expected but last response was HTTP $status."
            return 1
          }

          retry_body_contains \
            'edge health metadata' \
            'https://fingo.api.br/__finobra/health' \
            '"ok":true' \
            '"securityMode":"nonce-csp"' \
            '"loopRisk":false' \
            '"deploymentMetadataOk":true' \
            "\"commit\":\"$GITHUB_SHA\""
          health="$RETRY_BODY"

          retry_body_contains \
            'version metadata' \
            'https://fingo.api.br/version.json' \
            "\"commit\":\"$GITHUB_SHA\"" \
            '"source":"github-actions"'
          version="$RETRY_BODY"

          retry_body_contains \
            'Edge API health' \
            'https://fingo.api.br/api/v2/system/health' \
            '"ok":true' \
            '"service":"fingo-edge-v2"' \
            '"runtime":"cloudflare-workers"'
          edge_api_health="$RETRY_BODY"

          retry_status_equals \
            'unauthenticated auth contract' \
            'https://fingo.api.br/api/auth?action=me' \
            '401'
          auth_status="$RETRY_STATUS"

          check_route() {
            local url="$1"
            local expected_route="$2"
            local expected_text="$3"
            local prefix="$4"
            local status
            local route_header

            echo "Smoke route: $url -> $expected_route"
            status="$(curl --silent --show-error --dump-header "/tmp/${prefix}.headers" --output "/tmp/${prefix}.html" --write-out '%{http_code}' "$url")"
            if [[ "$status" != '200' ]]; then
              echo "::error::$url returned HTTP $status"
              return 1
            fi
            route_header="$(tr -d '\r' < "/tmp/${prefix}.headers" | grep -i '^x-finobra-route:' | tail -n 1 || true)"
            if [[ ! "$route_header" =~ ^[Xx]-[Ff]in[Oo]bra-[Rr]oute:[[:space:]]*${expected_route}$ ]]; then
              echo "::error::$url route header mismatch. Expected $expected_route; got: $route_header"
              return 1
            fi
            if grep -Fq "$expected_text" "/tmp/${prefix}.html"; then
              echo "Content marker PASS: $expected_text"
            else
              echo "::warning::$url is routed correctly but content marker changed: $expected_text"
            fi
          }

          check_private_header() {
            local file="$1"
            local label="$2"
            if ! tr -d '\r' < "$file" | grep -qi '^x-robots-tag:.*noindex'; then
              echo "::error::$label missing X-Robots-Tag noindex"
              return 1
            fi
          }

          check_document() {
            local url="$1"
            local expected_text="$2"
            local prefix="$3"
            local status

            echo "Smoke document: $url"
            status="$(curl --silent --show-error --output "/tmp/${prefix}.html" --write-out '%{http_code}' "$url")"
            if [[ "$status" != '200' ]]; then
              echo "::error::$url returned HTTP $status"
              return 1
            fi
            if grep -Fq "$expected_text" "/tmp/${prefix}.html"; then
              echo "Content marker PASS: $expected_text"
            else
              echo "::warning::$url is available but content marker changed: $expected_text"
            fi
          }

          check_route 'https://fingo.api.br/' 'landing-shell' 'class="ui-marketing"' 'fingo-home'
          grep -Fq '<link rel="canonical" href="https://fingo.api.br/">' /tmp/fingo-home.html || echo "::warning::Landing canonical markup changed after build"

          check_route 'https://fingo.api.br/login' 'login-shell' 'id="login-form"' 'fingo-login'
          check_private_header /tmp/fingo-login.headers 'login'
          grep -Fq '/css/auth-patch38.css' /tmp/fingo-login.html || echo "::warning::Auth CSS reference changed after build"
          grep -Fq '/js/auth-route-patch38.js' /tmp/fingo-login.html || echo "::warning::Auth route JS reference changed after build"

          check_route 'https://fingo.api.br/cadastro' 'signup-shell' 'id="register-modal"' 'fingo-signup'
          check_private_header /tmp/fingo-signup.headers 'cadastro'

          check_route 'https://fingo.api.br/app/dashboard' 'app-shell' '<div id="app-root"></div>' 'fingo-app'
          check_private_header /tmp/fingo-app.headers 'app'

          check_route 'https://fingo.api.br/master' 'master-shell' 'id="master-auth-gate"' 'fingo-master'
          check_private_header /tmp/fingo-master.headers 'master'
          check_document 'https://fingo.api.br/js/master_page.js' 'ensureDevTenantKeysModule' 'fingo-master-page-js'
          check_document 'https://fingo.api.br/js/dev-tenant-keys.js' 'Chaves das Empresas — DEV / Master' 'fingo-dev-tenant-keys-js'

          check_document 'https://fingo.api.br/privacidade' 'Política de Privacidade' 'fingo-privacy'
          check_document 'https://fingo.api.br/termos' 'Termos de Serviço' 'fingo-terms'
          check_document 'https://fingo.api.br/validar' 'Validação de Autenticidade Digital' 'fingo-validate'

          robots="$(curl --fail --silent --show-error https://fingo.api.br/robots.txt)"
          [[ "$robots" == *'Disallow: /login'* ]]
          [[ "$robots" == *'Disallow: /cadastro'* ]]
          [[ "$robots" == *'Sitemap: https://fingo.api.br/sitemap.xml'* ]]

          sitemap="$(curl --fail --silent --show-error https://fingo.api.br/sitemap.xml)"
          [[ "$sitemap" == *'<loc>https://fingo.api.br/</loc>'* ]]
          [[ "$sitemap" == *'<loc>https://fingo.api.br/privacidade</loc>'* ]]
          [[ "$sitemap" == *'<loc>https://fingo.api.br/termos</loc>'* ]]
          [[ "$sitemap" != *'/login'* ]]
          [[ "$sitemap" != *'/cadastro'* ]]
          [[ "$sitemap" != *'/app'* ]]

          echo "Cloudflare production smoke test passed for commit $GITHUB_SHA with Edge API, security and Master vault contracts."
