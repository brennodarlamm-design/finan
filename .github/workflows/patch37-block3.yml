name: Patch 37 Block 3

on:
  push:
    branches:
      - patch37-commercial-account-release
    paths:
      - 'scripts/patch37-block3*.mjs'
      - '.github/workflows/patch37-block3.yml'

permissions:
  contents: write

concurrency:
  group: patch37-block3
  cancel-in-progress: true

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patch37-commercial-account-release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Patch 37 block 3
        run: |
          node scripts/patch37-block3.mjs
          node scripts/patch37-block3-fix.mjs
      - name: Full regression suite
        run: npm test
      - name: Syntax verification
        run: node scripts/check-all-syntax.js
      - name: Dependency audits
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=high
          npm --prefix backend audit --audit-level=high
      - name: Build Cloudflare assets
        run: npm run build:cloudflare
      - name: Wrangler dry-run
        run: npx --yes wrangler deploy --dry-run
      - name: Verify mobile invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'viewport-fit=cover' app.html
          grep -q 'FINOBRA_PATCH37_MOBILE_OPERATIONAL' css/style.css
          grep -q 'cfg-audit-mobile-render' js/configuracoes.js
          grep -q 'cfg-session-card' js/configuracoes.js
          grep -q 'FINOBRA_PATCH37_ACCOUNT_MOBILE' js/cobranca.js
      - name: Commit validated block
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          git config user.name 'finobra-patch-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No functional changes to commit.'
            exit 0
          fi
          git commit -m 'feat(patch37): mobile operational experience for account and settings'
          git push origin HEAD:patch37-commercial-account-release
