name: Patch 27 immutable source validation

on:
  push:
    branches:
      - patch27-materialize-build-20260912

permissions:
  contents: read

jobs:
  validate-materialized-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Full regression suite
        run: npm test
      - name: Syntax verification
        run: node scripts/check-all-syntax.js
      - name: Ensure tests do not mutate tracked source
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo 'Source tree changed after npm test:'
            git status --short
            git diff --stat
            exit 1
          fi
          echo 'Source tree remained byte-stable after the full test suite.'
      - name: Build Cloudflare static assets
        run: npm run build:cloudflare
      - name: Validate Wrangler bundle without publishing
        run: npx --yes wrangler@latest deploy --dry-run --outdir .wrangler-dryrun
