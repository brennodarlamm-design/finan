name: Patch 35 large audit (no deploy)

on:
  push:
    branches:
      - patch35-large-audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: patch35-large-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Full codebase inventory
        run: |
          node scripts/audit-codebase.mjs
          cat audit/patch35-codebase.json
      - name: Full static regression suite
        run: npm test
      - name: Syntax verification
        run: node scripts/check-all-syntax.js
      - name: Cloudflare build and dry-run only
        run: |
          npm run build:cloudflare
          npx --yes wrangler deploy --dry-run
      - name: Root dependency audit
        continue-on-error: true
        run: npm audit --omit=dev
      - name: Backend dependency audit
        continue-on-error: true
        run: |
          cd backend
          npm ci
          npm audit --omit=dev
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: patch35-codebase-audit
          path: audit/patch35-codebase.json
          retention-days: 14
